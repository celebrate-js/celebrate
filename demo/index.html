<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@celebrate-js/celebrate — ぷちぷちポップイット（仮）</title>
    <style>
      :root {
        --accent: #d64545;
        --accent-weak: #f2b8b8;
        --ink-2: #333;
        --r-lg: 0.75rem;
        --r-sm: 0.25rem;
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        background: linear-gradient(180deg, #fff7e6 0%, #ffe9f3 45%, #e8f6ff 100%);
        color: #3a2e2e;
        min-height: 100vh;
      }

      /* ==== ポップイット（子ども向け・シリコンおもちゃ風） ==== */

      .popit-card {
        border-radius: 2rem;
        padding: 1.5rem 1.75rem 2rem;
        background: #ffffffb0;
        box-shadow: 0 10px 30px -12px rgba(120, 90, 60, 0.25);
        border: 3px dashed #ffd166;
      }

      .popit-title {
        font-size: 1.6rem;
        font-weight: 800;
        margin: 0 0 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .popit-hint {
        margin: 0 0 1.25rem;
        color: #7a6a5a;
        font-size: 0.95rem;
      }

      .popit-grid {
        display: grid;
        grid-template-columns: repeat(8, 3.6rem);
        gap: 0.7rem;
        justify-content: start;
      }

      .popit-bubble {
        position: relative;
        width: 3.6rem;
        height: 3.6rem;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 800;
        font-size: 0.9rem;
        color: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
        box-shadow:
          inset -4px -6px 0 rgba(0, 0, 0, 0.12),
          inset 3px 4px 0 rgba(255, 255, 255, 0.55),
          0 4px 6px rgba(120, 90, 60, 0.18);
      }

      .popit-bubble:hover {
        transform: translateY(-1px) scale(1.04);
      }

      .popit-bubble:active {
        transform: scale(0.88);
        box-shadow:
          inset 3px 4px 6px rgba(0, 0, 0, 0.25),
          inset -2px -3px 0 rgba(255, 255, 255, 0.25);
      }

      .popit-bubble-face {
        font-size: 1.3rem;
        line-height: 1;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25));
      }

      .popit-bubble-sound {
        position: absolute;
        top: -0.35rem;
        right: -0.35rem;
        font-size: 0.85rem;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
      }

      h1 {
        font-size: 1.9rem;
      }

      /* ==== ボーダーエフェクトのデモ ==== */

      .border-demo-card {
        border-radius: 1.25rem;
        padding: 1.25rem 1.5rem;
        background: #ffffff80;
        border: 1px solid #e4dcd0;
      }

      .border-demo-target {
        width: 12rem;
        padding: 1.2rem;
        border-radius: 0.75rem;
        background: #fff;
        border: 2px solid #e4dcd0;
        text-align: center;
        font-weight: 700;
        color: #3a2e2e;
        margin-bottom: 1rem;
      }

      .border-demo-buttons {
        display: flex;
        gap: 0.6rem;
      }

      .border-demo-buttons button {
        border-radius: 0.6rem;
        border: 1px solid #d8cfc2;
        background: #fff;
        color: #3a2e2e;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }

      .combo-button {
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #ff8a5c, #ff5c8a);
        color: #fff;
        font-weight: 800;
        font-size: 1.1rem;
        padding: 0.9rem 2rem;
        cursor: pointer;
        box-shadow: 0 6px 14px -4px rgba(255, 92, 138, 0.5);
      }

      .combo-button:active {
        transform: scale(0.96);
      }

      /* ==== ドキュメント風ヘッダー（react-toastify の Introduction ページに寄せた） ==== */

      .docs-header {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .docs-title {
        font-size: 2.2rem;
        font-weight: 800;
        margin: 0;
      }

      .docs-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .docs-badge {
        display: inline-flex;
        border-radius: 0.3rem;
        overflow: hidden;
        font-size: 0.78rem;
        font-weight: 700;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }

      .docs-badge span {
        padding: 0.22rem 0.55rem;
      }

      .docs-badge span:first-child {
        background: #555;
        color: #fff;
      }

      .docs-badge span:last-child {
        background: var(--accent);
        color: #fff;
      }

      /* ==== プレイグラウンド（react-toastify の "The playground" に相当） ==== */

      .playground-card {
        border-radius: 1.25rem;
        padding: 1.5rem 1.75rem 2rem;
        background: #ffffffb0;
        box-shadow: 0 10px 30px -12px rgba(120, 90, 60, 0.25);
        border: 1px solid #e4dcd0;
      }

      .playground-grid {
        display: grid;
        grid-template-columns: minmax(16rem, 1fr) minmax(16rem, 1fr);
        gap: 1.5rem;
        align-items: start;
        margin-bottom: 1.25rem;
      }

      @media (max-width: 46rem) {
        .playground-grid {
          grid-template-columns: 1fr;
        }
      }

      .playground-controls {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .playground-controls > label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: #5a4a3a;
      }

      .playground-controls select,
      .playground-controls input[type="text"],
      .playground-controls input[type="range"],
      .playground-controls input[type="color"] {
        color-scheme: light;
      }

      .playground-controls select,
      .playground-controls input[type="text"] {
        border-radius: 0.5rem;
        border: 1px solid #d8cfc2;
        padding: 0.4rem 0.6rem;
        font: inherit;
        background: #fff;
        color: #3a2e2e;
      }

      .playground-controls fieldset {
        border: 1px solid #e4dcd0;
        border-radius: 0.6rem;
        padding: 0.6rem 0.75rem;
      }

      .playground-controls legend {
        font-size: 0.8rem;
        font-weight: 700;
        color: #5a4a3a;
        padding: 0 0.3rem;
      }

      .playground-with-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.9rem;
        max-height: 7rem;
        overflow-y: auto;
      }

      .playground-checkbox {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: #3a2e2e;
      }

      .playground-code {
        border-radius: 0.75rem;
        background: #1e1e2e;
        padding: 1rem 1.1rem;
        overflow-x: auto;
      }

      .playground-code pre {
        margin: 0;
      }

      .playground-code code {
        color: #e2dfff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ==== Features（react-toastify の Features 箇条書きに相当） ==== */

      .features-card {
        border-radius: 1.25rem;
        padding: 1.25rem 1.5rem;
        background: #ffffff80;
        border: 1px solid #e4dcd0;
      }

      .features-list {
        margin: 0;
        padding-left: 1.3rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(12rem, 1fr));
        gap: 0.35rem 1.5rem;
        font-size: 0.9rem;
        color: #4a3a2e;
      }

      @media (max-width: 40rem) {
        .features-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
