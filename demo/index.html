<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@celebrate-js/celebrate — ドキュメント</title>
    <style>
      :root {
        --accent: #d64545;
        --accent-weak: #f2b8b8;
        --ink-2: #333;
        --r-lg: 0.75rem;
        --r-sm: 0.25rem;
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        background: #f7f5f2;
        color: #2b2622;
        min-height: 100vh;
      }

      h1 {
        font-size: 1.9rem;
      }

      a {
        color: var(--accent);
      }

      /* ==== 全セクション共通のカード（旧: popit-card / border-demo-card /
         playground-card / features-card。見た目がほぼ同じだったので統一した） ==== */

      .doc-section {
        border-radius: 1rem;
        padding: 1.25rem 1.5rem 1.75rem;
        background: #ffffff;
        box-shadow: 0 6px 20px -14px rgba(40, 30, 20, 0.35);
        border: 1px solid #e6e1d8;
      }

      .section-title {
        font-size: 1.35rem;
        font-weight: 800;
        margin: 0 0 0.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-hint {
        margin: 0 0 1.25rem;
        color: #6b6154;
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .section-hint code,
      .catalog-card-description code {
        background: #f0ece3;
        border-radius: 0.25rem;
        padding: 0.05rem 0.35rem;
        font-size: 0.85em;
      }

      /* ==== 区切り見出し（Tier 2 / Tier 3 のような大区分） ==== */

      .section-divider {
        padding: 0.5rem 0.25rem 0;
      }

      .section-divider h2 {
        font-size: 1.15rem;
        font-weight: 800;
        margin: 0 0 0.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .section-divider p {
        margin: 0;
        color: #6b6154;
        font-size: 0.88rem;
      }

      /* ==== ボーダーエフェクトのデモ ==== */

      .border-demo-target {
        width: 12rem;
        padding: 1.2rem;
        border-radius: 0.75rem;
        background: #fff;
        border: 2px solid #e4dcd0;
        text-align: center;
        font-weight: 700;
        color: #3a2e2e;
        margin-bottom: 1rem;
      }

      .border-demo-buttons {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .border-demo-buttons button {
        border-radius: 0.6rem;
        border: 1px solid #d8cfc2;
        background: #fff;
        color: #3a2e2e;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }

      .combo-button {
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #ff8a5c, #ff5c8a);
        color: #fff;
        font-weight: 800;
        font-size: 1.1rem;
        padding: 0.9rem 2rem;
        cursor: pointer;
        box-shadow: 0 6px 14px -4px rgba(255, 92, 138, 0.5);
      }

      .combo-button:active {
        transform: scale(0.96);
      }

      /* ==== ドキュメントヘッダー（react-toastify の Introduction ページに寄せた） ==== */

      .docs-header {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }

      .docs-title {
        font-size: 2.2rem;
        font-weight: 800;
        margin: 0;
      }

      .docs-tagline {
        margin: 0;
        color: #6b6154;
        font-size: 1rem;
        max-width: 44rem;
        line-height: 1.6;
      }

      .docs-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .docs-badge {
        display: inline-flex;
        border-radius: 0.3rem;
        overflow: hidden;
        font-size: 0.78rem;
        font-weight: 700;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
      }

      .docs-badge span {
        padding: 0.22rem 0.55rem;
      }

      .docs-badge span:first-child {
        background: #555;
        color: #fff;
      }

      .docs-badge span:last-child {
        background: var(--accent);
        color: #fff;
      }

      /* ==== カタログ（Tier 1・25 variant） ==== */

      .catalog-category {
        margin-top: 1.5rem;
      }

      .catalog-category:first-of-type {
        margin-top: 0;
      }

      .catalog-category-title {
        font-size: 1rem;
        font-weight: 800;
        margin: 0 0 0.15rem;
      }

      .catalog-category-description {
        margin: 0 0 0.75rem;
        color: #6b6154;
        font-size: 0.85rem;
      }

      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: 0.75rem;
      }

      .catalog-card {
        border-radius: 0.75rem;
        border: 1px solid #e6e1d8;
        background: #fbfaf7;
        padding: 0.9rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .catalog-card-head {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .catalog-card-name {
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--accent);
      }

      .catalog-card-sound {
        font-size: 0.8rem;
      }

      .catalog-card-description {
        margin: 0;
        font-size: 0.85rem;
        color: #4a4238;
        line-height: 1.5;
        flex: 1;
      }

      .catalog-card-code {
        margin: 0;
        border-radius: 0.5rem;
        background: #1e1e2e;
        padding: 0.5rem 0.65rem;
        overflow-x: auto;
      }

      .catalog-card-code code {
        color: #e2dfff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .catalog-card-trigger {
        align-self: flex-start;
        border-radius: 0.5rem;
        border: 1px solid var(--accent);
        background: #fff;
        color: var(--accent);
        font-weight: 700;
        font-size: 0.82rem;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
      }

      .catalog-card-trigger:hover {
        background: var(--accent);
        color: #fff;
      }

      /* ==== プレイグラウンド（react-toastify の "The playground" に相当） ==== */

      .playground-grid {
        display: grid;
        grid-template-columns: minmax(16rem, 1fr) minmax(16rem, 1fr);
        gap: 1.5rem;
        align-items: start;
        margin-bottom: 1.25rem;
      }

      @media (max-width: 46rem) {
        .playground-grid {
          grid-template-columns: 1fr;
        }
      }

      .playground-controls {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .playground-controls > label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        font-size: 0.85rem;
        font-weight: 700;
        color: #5a4a3a;
      }

      .playground-controls select,
      .playground-controls input[type="text"],
      .playground-controls input[type="range"],
      .playground-controls input[type="color"] {
        color-scheme: light;
      }

      .playground-controls select,
      .playground-controls input[type="text"] {
        border-radius: 0.5rem;
        border: 1px solid #d8cfc2;
        padding: 0.4rem 0.6rem;
        font: inherit;
        background: #fff;
        color: #3a2e2e;
      }

      .playground-controls fieldset {
        border: 1px solid #e4dcd0;
        border-radius: 0.6rem;
        padding: 0.6rem 0.75rem;
      }

      .playground-controls legend {
        font-size: 0.8rem;
        font-weight: 700;
        color: #5a4a3a;
        padding: 0 0.3rem;
      }

      .playground-with-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.9rem;
        max-height: 7rem;
        overflow-y: auto;
      }

      .playground-checkbox {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.8rem;
        font-weight: 500;
        color: #3a2e2e;
      }

      .playground-code {
        border-radius: 0.75rem;
        background: #1e1e2e;
        padding: 1rem 1.1rem;
        overflow-x: auto;
      }

      .playground-code pre {
        margin: 0;
      }

      .playground-code code {
        color: #e2dfff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ==== Features（react-toastify の Features 箇条書きに相当） ==== */

      .features-list {
        margin: 0;
        padding-left: 1.3rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(12rem, 1fr));
        gap: 0.35rem 1.5rem;
        font-size: 0.9rem;
        color: #4a3a2e;
      }

      @media (max-width: 40rem) {
        .features-list {
          grid-template-columns: 1fr;
        }
      }

      /* ==== APIリファレンス ==== */

      .api-subsection {
        margin-top: 1.75rem;
      }

      .api-subsection:first-of-type {
        margin-top: 0;
      }

      .api-subsection h3 {
        font-size: 1rem;
        font-weight: 800;
        margin: 0 0 0.4rem;
      }

      .api-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        margin-top: 0.5rem;
      }

      .api-table th,
      .api-table td {
        text-align: left;
        padding: 0.45rem 0.6rem;
        border-bottom: 1px solid #e6e1d8;
        vertical-align: top;
      }

      .api-table th {
        color: #5a4a3a;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .api-table td:first-child,
      .api-table td:nth-child(2) {
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      .api-table td:nth-child(3) {
        color: #6b6154;
        white-space: nowrap;
      }

      .api-table code {
        background: #f0ece3;
        border-radius: 0.25rem;
        padding: 0.05rem 0.35rem;
        font-size: 0.95em;
      }

      @media (max-width: 40rem) {
        .api-table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
